<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK3 练习册讲解</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0 0 40px 90px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#eef1f5;color:#1f2328;font-size:16px;}
header{background:linear-gradient(135deg,#3a6ea5,#2b4c7e);color:#fff;padding:6px 16px 8px;position:sticky;top:0;z-index:80;box-shadow:0 2px 8px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:6px;}
.header-row{display:flex;align-items:center;gap:12px;min-height:36px;}
header h1{margin:0;font-size:14px;font-weight:600;white-space:nowrap;}
.lesson-nav{display:flex;gap:4px;flex-shrink:1;overflow-x:auto;padding:2px 0;scrollbar-width:thin;}
.lesson-nav button{padding:3px 9px;border-radius:12px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;font-size:11.5px;font-family:inherit;transition:.15s;white-space:nowrap;flex-shrink:0;}
.lesson-nav button:hover{background:rgba(255,255,255,.15);}
.lesson-nav button.active{background:#fff;color:#2b4c7e;font-weight:700;border-color:#fff;}

/* ===== 音频条（自定义播放器） ===== */
.audio-bar{display:flex;align-items:center;gap:7px;width:100%;padding:3px 0;}
.audio-bar audio{display:none;}
.abtn{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);
      background:rgba(255,255,255,.12);color:#fff;font-size:12px;line-height:1;font-family:inherit;
      cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;
      transition:.15s;-webkit-tap-highlight-color:transparent;}
.abtn:hover{background:rgba(255,255,255,.28);}
.abtn:active{transform:scale(.93);}
.abtn.play{width:36px;height:36px;font-size:14px;background:rgba(255,255,255,.22);}
.abtn.rate{font-size:11px;font-weight:700;letter-spacing:-.3px;}
.time{flex:0 0 auto;font-size:11px;color:#cfe0f5;font-family:Arial,Helvetica,sans-serif;
      font-variant-numeric:tabular-nums;min-width:36px;text-align:center;}
.audio-bar .fname{flex:0 0 auto;font-size:11px;color:#cfe0f5;max-width:160px;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap;}

/* 进度条 */
.seek{flex:1 1 auto;min-width:80px;-webkit-appearance:none;appearance:none;height:34px;margin:0;
      background:transparent;cursor:pointer;touch-action:pan-y;outline:none;padding:0;}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;
      background:linear-gradient(to right,#8fc0f5 0%,#8fc0f5 var(--p,0%),
                 rgba(255,255,255,.28) var(--p,0%),rgba(255,255,255,.28) 100%);}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;
      margin-top:-5px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 4px rgba(0,0,0,.45);}
.seek::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28);}
.seek::-moz-range-progress{height:6px;border-radius:3px;background:#8fc0f5;}
.seek::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:#fff;
      box-shadow:0 1px 4px rgba(0,0,0,.45);}

.quicknav{position:fixed;left:0;top:98px;bottom:0;width:90px;background:#f7f9fc;border-right:1px solid #dde4ec;display:none;flex-direction:column;z-index:60;}
.quicknav.active{display:flex;}
.qn-body{flex:1;overflow-y:auto;padding:10px 7px 6px;}
.quicknav h4{font-size:11px;color:#8a99ab;margin:10px 0 5px;padding-left:3px;font-weight:600;letter-spacing:.4px;}
.qn-btn{display:block;width:100%;margin:3px 0;padding:5px 3px;border:1px solid #d3dde8;background:#fff;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;color:#33445a;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;}
.qn-btn:hover{background:#e8f0fa;border-color:#3a6ea5;color:#2b4c7e;}
.qn-toggle{padding:8px 7px;border-top:1px solid #dde4ec;background:#eef2f7;display:flex;flex-direction:column;gap:6px;}
.qn-toggle button{padding:7px 3px;border-radius:8px;border:1.5px solid #3a6ea5;background:#3a6ea5;color:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:.18s;line-height:1.25;}
.qn-toggle button:hover{background:#2b4c7e;}
.qn-toggle button.off{background:#fff;color:#3a6ea5;}
main{max-width:1000px;margin:0 auto;padding:18px 16px;}
.page{display:none;}
.page.active{display:block;}
.lesson>h2{font-size:21px;margin:20px 0 14px;padding:14px 18px;background:#fff;border-left:6px solid #3a6ea5;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.06);line-height:1.5;}
.lesson>h2 .title-py{display:block;font-size:13px;color:#7a8899;font-weight:400;margin-top:4px;}
.lesson>h2 small{display:block;font-weight:400;color:#8a99ab;font-size:13px;margin-top:2px;}
.part{background:#fff;border-radius:10px;padding:16px 18px 20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);scroll-margin-top:130px;}
.part>h3{margin:0 0 12px;font-size:17px;color:#2b4c7e;border-bottom:2px solid #e3e8ef;padding-bottom:8px;}
.part>h4{margin:18px 0 10px;font-size:14.5px;color:#446;font-weight:600;background:#f4f7fb;padding:8px 12px;border-radius:6px;scroll-margin-top:130px;}
.pic-wrap{margin:10px 0 16px;text-align:center;}
.pic-wrap img{max-width:100%;border-radius:8px;border:1px solid #dde4ec;}
.pic-ph{display:block;padding:22px;background:#fffbe6;border:1.5px dashed #e0c66b;border-radius:8px;color:#a8730a;font-size:14px;line-height:1.9;}
.pic-ph b{color:#8a5a00;}
.q{padding:12px 14px;margin:12px 0;border-left:3px solid #d8e0ea;background:#fbfcfe;border-radius:0 8px 8px 0;scroll-margin-top:130px;}
.q.example{background:#f3f7ff;border-left-color:#8bb0e0;}
.qhead{font-size:13.5px;margin-bottom:8px;color:#5a6b7d;font-weight:600;}
.qhead .num{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;background:#3a6ea5;color:#fff;border-radius:12px;font-size:12.5px;margin-right:8px;padding:0 7px;}
.q.example .qhead .num{background:#c47b1e;}
.zh{line-height:2.3;font-size:15px;}
.stem{margin:2px 0;}
.ask{margin:8px 0 8px;color:#8a5a00;font-size:14.5px;font-weight:600;}
.sent-en{display:block;color:#0d8050;font-size:13px;line-height:1.65;margin:5px 0 2px 10px;font-style:italic;border-left:3px solid #b7e4cd;padding-left:10px;}
body:not(.show-en) .sent-en{display:none;}
.w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 1px;}
.w .py{font-size:11px;line-height:14px;min-height:14px;color:#c0392b;font-family:Arial,Helvetica,sans-serif;white-space:nowrap;}
.w .hz{font-size:18px;line-height:25px;white-space:nowrap;}
.w .en{font-size:10px;line-height:14px;min-height:14px;color:#1a73e8;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;}
body:not(.show-py) .w .py{display:none;}
body:not(.show-en) .w .en{display:none;}
h3 .w .hz,h4 .w .hz,.qhead .w .hz{font-size:inherit;line-height:1.45;}
h3 .w,h4 .w,.qhead .w{vertical-align:middle;}
h3 .w .py,h4 .w .py,.qhead .w .py{font-size:10px;line-height:13px;min-height:13px;}
h3 .w .en,h4 .w .en,.qhead .w .en{font-size:9.5px;line-height:12px;min-height:12px;}
.ans-box .w .hz{font-size:15px;line-height:1.95;}
.ans-box .w .py{color:#b07a2a;}
.ans-box .w .en{color:#0d8050;}
.ask .w .hz{font-size:15px;}
.ask .w .py{color:#c0392b;}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.opt{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border:1.5px solid #cdd7e2;border-radius:20px;background:#fff;cursor:pointer;user-select:none;font-size:15px;transition:.18s;}
.opt:hover{border-color:#3a6ea5;background:#f2f7ff;}
.opt i{font-style:normal;font-weight:700;color:#3a6ea5;}
.opt.ok{border-color:#1e9e5a;background:#e8f9ef;}
.opt.ok i{color:#1e9e5a;}
.opt.ok::after{content:"✓";color:#1e9e5a;font-weight:700;margin-left:4px;}
.opt.no{border-color:#d64545;background:#fdeaea;}
.opt.no i{color:#d64545;}
.opt.no::after{content:"✗";color:#d64545;font-weight:700;margin-left:4px;}
.tf{display:flex;gap:10px;margin-top:8px;}
.tfbtn{padding:6px 24px;border-radius:20px;border:1.5px solid #cdd7e2;background:#fff;cursor:pointer;font-size:17px;font-family:inherit;transition:.18s;}
.tfbtn:hover{border-color:#3a6ea5;}
.tfbtn.ok{border-color:#1e9e5a;background:#e8f9ef;color:#1e9e5a;font-weight:700;}
.tfbtn.no{border-color:#d64545;background:#fdeaea;color:#d64545;font-weight:700;}
.tf-feedback{margin-top:8px;font-size:14px;line-height:1.7;display:none;}
.tf-feedback.show{display:block;}
.tf-feedback .res{font-weight:700;font-size:15px;}
.tf-feedback .res.right{color:#1e9e5a;}
.tf-feedback .res.wrong{color:#d64545;}
.tf-feedback .ansline{color:#2b4c7e;font-weight:600;margin-top:4px;}
.tf-feedback .expl{color:#5a6b7d;font-size:13px;margin-top:3px;}
.ans-btn{display:inline-block;margin-top:10px;padding:6px 18px;background:#3a6ea5;color:#fff;border:none;border-radius:18px;cursor:pointer;font-size:13.5px;font-family:inherit;transition:.18s;}
.ans-btn:hover{background:#2b4c7e;}
.ans-btn.shown{background:#9aa7b6;}
.ans-box{display:none;margin-top:10px;padding:10px 14px;background:#eef7f1;border-left:4px solid #1e9e5a;border-radius:0 8px 8px 0;font-size:14px;line-height:1.9;color:#1f4634;}
.ans-box.show{display:block;}
.ans-box .lbl{font-weight:700;color:#1e9e5a;}
.opt-table{background:#f4f7fb;border-radius:8px;padding:10px 14px;margin:12px 0;border:1px solid #dde4ec;}
.opt-row{padding:8px 0;border-bottom:1px dashed #dde4ec;line-height:2.4;}
.opt-row:last-child{border-bottom:none;}
.opt-row b{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;background:#3a6ea5;color:#fff;border-radius:12px;font-size:13px;margin-right:8px;vertical-align:middle;}
.letter-picker{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.letter-picker button{width:34px;height:34px;border-radius:50%;border:1.5px solid #cdd7e2;background:#fff;cursor:pointer;font-size:15px;font-weight:700;color:#3a6ea5;font-family:inherit;transition:.18s;}
.letter-picker button:hover{border-color:#3a6ea5;background:#f2f7ff;}
.letter-picker button.ok{border-color:#1e9e5a;background:#e8f9ef;color:#1e9e5a;}
.letter-picker button.no{border-color:#d64545;background:#fdeaea;color:#d64545;}
.blank{display:inline-block;min-width:60px;text-align:center;border-bottom:2px solid #3a6ea5;padding:0 6px;color:#2b4c7e;font-weight:600;transition:.2s;}
.blank.ok{border-color:#1e9e5a;color:#1e9e5a;}
.blank.no{border-color:#d64545;color:#d64545;}
.write-item{padding:12px 14px;margin:10px 0;background:#fbfcfe;border-left:3px solid #d8e0ea;border-radius:0 8px 8px 0;scroll-margin-top:130px;}
.write-item .zh{line-height:2.3;}
.grammar{display:block;margin-top:8px;padding:8px 12px;background:#fff8e6;border-left:4px solid #e8b84b;border-radius:0 6px 6px 0;font-size:13px;line-height:1.8;color:#7a5a10;}
.grammar b{color:#8a5a00;}
.blank-input{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;}
.input-py{font-size:11px;line-height:14px;min-height:14px;color:#c0392b;font-family:Arial,Helvetica,sans-serif;white-space:nowrap;}
body:not(.show-py) .input-py{display:none;}
.blank-input input[type=text]{width:80px;padding:3px 8px;border:1.5px solid #cdd7e2;border-radius:6px;font-size:16px;font-family:inherit;outline:none;text-align:center;transition:.18s;}
.blank-input input.ok{border-color:#1e9e5a;background:#e8f9ef;color:#1e9e5a;font-weight:700;}
.blank-input input.no{border-color:#d64545;background:#fdeaea;color:#d64545;}
.fb-inline{font-size:13px;font-weight:600;margin-left:4px;}
.fb-inline.right{color:#1e9e5a;}
.fb-inline.wrong{color:#d64545;}
.review-blank .input-py{display:none;}
body.show-py .review-blank.revealed .input-py{display:inline-block;}
.placeholder{background:#fafbfc;border:1.5px dashed #c8d0d8;border-radius:8px;padding:22px;color:#6b7a8a;text-align:center;font-size:14px;line-height:1.9;}
.placeholder b{color:#3a6ea5;}
.mobile-fab{position:fixed;right:12px;bottom:14px;display:none;gap:8px;z-index:95;}
.mobile-fab button{padding:8px 14px;border-radius:20px;border:1.5px solid #3a6ea5;background:#3a6ea5;color:#fff;font-size:13px;font-family:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(58,110,165,.4);}
.mobile-fab button.off{background:#fff;color:#3a6ea5;}
@media(max-width:760px){
  body{padding-left:0;padding-bottom:90px;}
  .quicknav{display:none !important;}
  header{padding:6px 8px;}
  header h1{font-size:12px;}
  .audio-bar{gap:5px;}
  .abtn{width:29px;height:29px;font-size:10px;}
  .abtn.play{width:33px;height:33px;font-size:13px;}
  .abtn.rate{font-size:10px;}
  .seek{height:38px;}
  .seek::-webkit-slider-thumb{width:18px;height:18px;margin-top:-6px;}
  .time{font-size:10px;min-width:0;}
  .time.cur{display:none;}
  .audio-bar .fname{display:none;}
  .lesson-nav button{padding:3px 7px;font-size:10.5px;}
  .w .hz{font-size:16px;line-height:22px;}
  .w .py{font-size:10px;line-height:12px;min-height:12px;}
  .w .en{font-size:9px;line-height:12px;min-height:12px;}
  main{padding:12px 8px;}
  .mobile-fab{display:flex;}
}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>HSK 3 · 练习册</h1>
    <div class="lesson-nav" id="lessonNav"></div>
  </div>
  <div class="audio-bar">
    <button id="backBtn" class="abtn" title="后退15秒">«15</button>
    <button id="playBtn" class="abtn play" title="播放/暂停">▶</button>
    <button id="fwdBtn" class="abtn" title="前进15秒">15»</button>
    <span class="time cur" id="curTime">00:00</span>
    <input type="range" id="seek" class="seek" min="0" max="1000" step="1" value="0" aria-label="播放进度">
    <span class="time" id="durTime">00:00</span>
    <button id="rateBtn" class="abtn rate" title="倍速">1x</button>
    <span class="fname" id="audioName"></span>
    <audio id="audioEl" preload="metadata"></audio>
  </div>
</header>

<aside class="quicknav active" id="quicknav">
  <div class="qn-body" id="qnBody"></div>
  <div class="qn-toggle">
    <button id="btnPy" class="off">拼音<small style="display:block;font-size:9px;opacity:.8;">Pinyin</small></button>
    <button id="btnEn" class="off">英语<small style="display:block;font-size:9px;opacity:.8;">English</small></button>
  </div>
</aside>

<div class="mobile-fab">
  <button id="btnPyM" class="off">拼音</button>
  <button id="btnEnM" class="off">英语</button>
</div>

<main id="main"></main>

<script src="lessons-01-05.js"></script>
<script src="lessons-06-10.js"></script>
<script src="lessons-11-15.js"></script>
<script src="lessons-16-20.js"></script>

<script>
window.LESSONS = window.LESSONS || {};
const LESSON_ORDER = Object.keys(LESSONS).map(Number).sort((a,b)=>a-b);
const lessonNav = document.getElementById('lessonNav');
const qnBody = document.getElementById('qnBody');
const main = document.getElementById('main');

/* ===== 普通课（第 1–20 课）的左侧题号导航结构 ===== */
const QUICKNAV_STRUCTURE = [
  {section:"听力", items:[
    {id:"l1", label:"1-5 图片"},{id:"l2", label:"6-10 判断"},
    {id:"l3", label:"11-15 短对话"},{id:"l4", label:"16-20 长对话"}
  ]},
  {section:"阅读", items:[
    {id:"r1", label:"21-25 问答"},{id:"r2", label:"26-30 选词"},{id:"r3", label:"31-35 短文"}
  ]},
  {section:"书写", items:[
    {id:"w1", label:"36-40 连句"},{id:"w2", label:"41-45 写汉字"},
    {id:"w3", label:"46-50 辨字"},{id:"w4", label:"51-54 组词"}
  ]},
  {section:"复习", items:[{id:"rev", label:"复习填空"}]}
];

/* ===== 模拟卷（第 21 课）的左侧题号导航结构 ===== */
const QUICKNAV_STRUCTURE_TEST = [
  {section:"听力", items:[
    {id:"l1",  label:"1-5 图片①"},
    {id:"l1b", label:"6-10 图片②"},
    {id:"l2",  label:"11-20 判断"},
    {id:"l3",  label:"21-30 短对话"},
    {id:"l4",  label:"31-40 长对话"}
  ]},
  {section:"阅读", items:[
    {id:"r1", label:"41-50 问答"},
    {id:"r2", label:"51-60 选词"},
    {id:"r3", label:"61-70 短文"}
  ]},
  {section:"书写", items:[
    {id:"w1", label:"71-75 连句"},
    {id:"w2", label:"76-80 写汉字"}
  ]}
];

function getQuicknavStructure(lessonNum){
  return lessonNum === 21 ? QUICKNAV_STRUCTURE_TEST : QUICKNAV_STRUCTURE;
}

/* ================= 音频播放器 ================= */
const audioEl   = document.getElementById('audioEl');
const audioName = document.getElementById('audioName');
const playBtn   = document.getElementById('playBtn');
const backBtn   = document.getElementById('backBtn');
const fwdBtn    = document.getElementById('fwdBtn');
const rateBtn   = document.getElementById('rateBtn');
const seek      = document.getElementById('seek');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');

const RATES = [0.75, 1, 1.25, 1.5, 2];
let rateIdx = 1;
let currentPage = 1;
let isSeeking   = false;
let pendingSeek = null;

/* ---------- 存储工具 ---------- */
const POS_KEY  = n => 'hsk3_pos_' + n;
const RATE_KEY = 'hsk3_rate';
function getSavedPos(n){
  const v = parseFloat(localStorage.getItem(POS_KEY(n)));
  return (isFinite(v) && v > 0) ? v : 0;
}
function savePos(n, t){
  if(!n || !isFinite(t) || t <= 0.5) return;
  try { localStorage.setItem(POS_KEY(n), String(t)); } catch(e){}
}

/* ---------- 文件名 ---------- */
function getAudioFilename(n){
  if(n === 21) return 'HSK标准教程3练习册 21 HSK(三级)模拟试卷.mp3';
  if(n < 10)   return `HSK标准教程3练习册 0${n}.mp3`;
  return `HSK标准教程3练习册 ${n}.mp3`;
}

/* ---------- 时间格式 & 进度条绘制 ---------- */
function fmtTime(t){
  if(!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function paintProgress(ratio, sec){
  const p = Math.min(1, Math.max(0, ratio));
  seek.value = Math.round(p*1000);
  seek.style.setProperty('--p', (p*100).toFixed(2) + '%');
  if(sec !== undefined) curTimeEl.textContent = fmtTime(sec);
}
function refreshProgress(){
  const d = audioEl.duration;
  if(!d || !isFinite(d)) return;
  paintProgress(audioEl.currentTime / d, audioEl.currentTime);
}

/* ---------- 倍速 ---------- */
function applyRate(){
  audioEl.playbackRate = RATES[rateIdx];
  rateBtn.textContent = RATES[rateIdx] + 'x';
}
rateBtn.addEventListener('click', ()=>{
  rateIdx = (rateIdx + 1) % RATES.length;
  applyRate();
  try { localStorage.setItem(RATE_KEY, String(RATES[rateIdx])); } catch(e){}
});
(function restoreRate(){
  const r = parseFloat(localStorage.getItem(RATE_KEY));
  const i = RATES.indexOf(r);
  if(i >= 0) rateIdx = i;
  applyRate();
})();

/* ---------- 换课时加载 ---------- */
function loadAudioForPage(n, prevPage){
  if(prevPage != null && prevPage !== n){
    savePos(prevPage, audioEl.currentTime);
  }
  const filename = getAudioFilename(n);
  audioEl.pause();
  audioEl.src = 'assets/' + encodeURI(filename);
  audioEl.load();
  applyRate();
  audioName.textContent = filename;
  audioName.style.color = '#cfe0f5';
  isSeeking = false;
  pendingSeek = null;
  playBtn.textContent = '▶';
  paintProgress(0, 0);
  durTimeEl.textContent = '00:00';
}

/* ---------- 播放 / 暂停 ---------- */
playBtn.addEventListener('click', ()=>{
  if(audioEl.paused) audioEl.play().catch(()=>{});
  else audioEl.pause();
});
audioEl.addEventListener('play',  ()=>{ playBtn.textContent = '❚❚'; });
audioEl.addEventListener('pause', ()=>{
  playBtn.textContent = '▶';
  savePos(currentPage, audioEl.currentTime);
});
audioEl.addEventListener('ended', ()=>{
  playBtn.textContent = '▶';
  try { localStorage.removeItem(POS_KEY(currentPage)); } catch(e){}
});

/* ---------- 快退 / 快进 15 秒 ---------- */
backBtn.addEventListener('click', ()=>{
  audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
});
fwdBtn.addEventListener('click', ()=>{
  const d = audioEl.duration || 0;
  audioEl.currentTime = Math.min(d, audioEl.currentTime + 15);
});

/* ---------- 进度条拖动 ---------- */
seek.addEventListener('pointerdown', ()=>{ isSeeking = true; });
seek.addEventListener('input', ()=>{
  isSeeking = true;
  const r = seek.value / 1000;
  const d = audioEl.duration;
  seek.style.setProperty('--p', (r*100).toFixed(2) + '%');
  curTimeEl.textContent = fmtTime(r * (isFinite(d) ? d : 0));
});
function endSeek(){
  if(!isSeeking) return;
  isSeeking = false;
  const d = audioEl.duration;
  if(d && isFinite(d)){
    audioEl.currentTime = seek.value / 1000 * d;
    paintProgress(seek.value/1000, audioEl.currentTime);
    savePos(currentPage, audioEl.currentTime);
  }
}
seek.addEventListener('change', endSeek);
seek.addEventListener('pointerup', endSeek);
seek.addEventListener('pointercancel', endSeek);

/* ---------- 元数据 / 续播 / 时间同步 ---------- */
audioEl.addEventListener('loadedmetadata', ()=>{
  durTimeEl.textContent = fmtTime(audioEl.duration);
  const saved = getSavedPos(currentPage);
  if(saved > 1 && saved < audioEl.duration - 3){
    try {
      audioEl.currentTime = saved;
      paintProgress(saved / audioEl.duration, saved);
    } catch(e){
      pendingSeek = saved;
    }
  }
});
audioEl.addEventListener('durationchange', ()=>{
  durTimeEl.textContent = fmtTime(audioEl.duration);
});
audioEl.addEventListener('canplay', ()=>{
  if(pendingSeek != null){
    try {
      audioEl.currentTime = pendingSeek;
      paintProgress(pendingSeek / (audioEl.duration || 1), pendingSeek);
    } catch(e){}
    pendingSeek = null;
  }
});
let lastSave = 0;
audioEl.addEventListener('timeupdate', ()=>{
  if(!isSeeking) refreshProgress();
  const now = Date.now();
  if(!isSeeking && now - lastSave > 2000){
    lastSave = now;
    savePos(currentPage, audioEl.currentTime);
  }
});
window.addEventListener('beforeunload', ()=>{
  savePos(currentPage, audioEl.currentTime);
});
window.addEventListener('pagehide', ()=>{
  savePos(currentPage, audioEl.currentTime);
});

/* ---------- 加载失败提示 ---------- */
audioEl.addEventListener('error', ()=>{
  audioName.textContent = '⚠ 未找到：' + getAudioFilename(currentPage);
  audioName.style.color = '#ffb0b0';
});

/* ================= 左侧题号导航 ================= */
function buildQuicknav(lessonNum){
  qnBody.innerHTML = '';
  getQuicknavStructure(lessonNum).forEach(group=>{
    const h = document.createElement('h4'); h.textContent = group.section;
    qnBody.appendChild(h);
    group.items.forEach(item=>{
      const b = document.createElement('button');
      b.className = 'qn-btn'; b.textContent = item.label;
      b.dataset.target = `L${lessonNum}-${item.id}`;
      b.addEventListener('click', ()=>{
        const t = document.getElementById(b.dataset.target);
        if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
      });
      qnBody.appendChild(b);
    });
  });
}

/* ================= 生成页面 ================= */
LESSON_ORDER.forEach(n=>{
  const lesson = LESSONS[n];
  const btn = document.createElement('button');
  btn.textContent = lesson.navLabel || ('第'+n+'课');
  btn.dataset.page = n;
  if(n === LESSON_ORDER[0]) btn.classList.add('active');
  btn.addEventListener('click', ()=>switchLesson(n));
  lessonNav.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'page' + (n === LESSON_ORDER[0] ? ' active' : '');
  sec.id = 'page-'+n;
  sec.dataset.lesson = n;
  sec.innerHTML = lesson.html;
  main.appendChild(sec);
});

function switchLesson(n){
  const prev = currentPage;
  currentPage = n;
  document.querySelectorAll('.lesson-nav button').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.page,10) === n);
  });
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page = document.getElementById('page-'+n);
  if(page) page.classList.add('active');
  buildQuicknav(n);
  loadAudioForPage(n, prev);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ================= 拼音 / 英语 开关 ================= */
const btnPy = document.getElementById('btnPy');
const btnEn = document.getElementById('btnEn');
const btnPyM = document.getElementById('btnPyM');
const btnEnM = document.getElementById('btnEnM');
function syncToggles(){
  const pyOn = document.body.classList.contains('show-py');
  const enOn = document.body.classList.contains('show-en');
  [btnPy,btnPyM].forEach(b=>b && b.classList.toggle('off', !pyOn));
  [btnEn,btnEnM].forEach(b=>b && b.classList.toggle('off', !enOn));
}
function togglePy(){ document.body.classList.toggle('show-py'); syncToggles(); }
function toggleEn(){ document.body.classList.toggle('show-en'); syncToggles(); }
[btnPy,btnPyM].forEach(b=>b && b.addEventListener('click', togglePy));
[btnEn,btnEnM].forEach(b=>b && b.addEventListener('click', toggleEn));

/* ================= 标注渲染 & 交互 ================= */
const RE_WORD = /\[([^\[\]|]*)\|([^\[\]|]*)\|([^\[\]]*)\]/g;
const MARKUP_SELECTOR = '.zh, .qhead, h3, h4, .ans-box, .expl';
function renderMarkup(root){
  root.querySelectorAll(MARKUP_SELECTOR).forEach(el=>{
    if(el.dataset.done) return;
    el.innerHTML = el.innerHTML.replace(RE_WORD, (m,hz,py,en)=>
      `<span class="w"><span class="py">${py}</span><span class="hz">${hz}</span><span class="en">${en}</span></span>`);
    el.dataset.done = "1";
  });
}
function bindInteractions(root){
  root.querySelectorAll('.opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const parent = opt.closest('.opts');
      parent.querySelectorAll('.opt').forEach(o=>o.classList.remove('ok','no'));
      if(opt.dataset.ok === '1'){ opt.classList.add('ok'); }
      else{
        opt.classList.add('no');
        parent.querySelectorAll('.opt').forEach(o=>{
          if(o.dataset.ok === '1') o.classList.add('ok');
        });
      }
      const q = opt.closest('.q');
      const btn = q.querySelector('.ans-btn'); const box = q.querySelector('.ans-box');
      if(btn && box){ btn.classList.add('shown'); box.classList.add('show'); }
    });
  });
  root.querySelectorAll('.tfbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const box = btn.closest('.tf'); const q = btn.closest('.q');
      const fb = q.querySelector('.tf-feedback'); if(!fb) return;
      const userChoice = btn.dataset.ok;
      const correct = fb.dataset.ans;
      const correctKey = (correct === '√') ? '1' : '0';
      box.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('ok','no'));
      const isRight = (userChoice === correctKey);
      if(isRight){ btn.classList.add('ok'); }
      else{
        btn.classList.add('no');
        box.querySelectorAll('.tfbtn').forEach(b=>{
          if(b.dataset.ok === correctKey) b.classList.add('ok');
        });
      }
      fb.innerHTML =
        `<div class="res ${isRight?'right':'wrong'}">${isRight?'✓ 回答正确 Correct!':'✗ 回答错误 Wrong'}</div>` +
        `<div class="ansline">答案 Answer：${correct}</div>` +
        `<div class="expl">${fb.dataset.explCn}<br>${fb.dataset.explEn}</div>`;
      fb.classList.add('show');
    });
  });
  root.querySelectorAll('.ans-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const q = btn.closest('.q, .write-item'); const box = q.querySelector('.ans-box');
      if(!box) return;
      const shown = box.classList.toggle('show');
      btn.classList.toggle('shown', shown);
      btn.textContent = shown ? '隐藏答案 hide' : '答案 answer';
      q.querySelectorAll('.review-blank').forEach(w=>w.classList.add('revealed'));
    });
  });
  root.querySelectorAll('.match-q').forEach(q=>{
    const answer = q.dataset.answer; const tableId = q.dataset.tableId;
    const table = tableId ? root.querySelector('#'+tableId) : null;
    const blank = q.querySelector('.blank'); const picker = q.querySelector('.letter-picker');
    if(!table || !blank || !picker) return;
    const optMap = {}; const optHtml = {};
    table.querySelectorAll('.opt-row').forEach(r=>{
      const L = r.dataset.l; if(!L) return;
      let txt = ''; r.querySelectorAll('.w .hz').forEach(h=>{ txt += h.textContent; });
      optMap[L] = txt;
      optHtml[L] = r.querySelector('.zh') ? r.querySelector('.zh').innerHTML : txt;
    });
    picker.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        const L = b.textContent.trim();
        picker.querySelectorAll('button').forEach(x=>x.classList.remove('ok','no'));
        const isRight = (L === answer);
        b.classList.add(isRight ? 'ok' : 'no');
        if(!isRight){
          picker.querySelectorAll('button').forEach(x=>{
            if(x.textContent.trim() === answer) x.classList.add('ok');
          });
        }
        const content = optMap[answer] || '';
        blank.innerHTML = answer + ' <span class="zh">' + (optHtml[answer] || content) + '</span>';
        renderMarkup(blank);
        blank.classList.add(isRight ? 'ok' : 'no');
      });
    });
  });
  root.querySelectorAll('.blank-input input[type=text]').forEach(inp=>{
    const wrapper = inp.closest('.blank-input');
    function check(){
      const ans = (inp.dataset.ans || '').trim();
      const val = (inp.value || '').trim();
      const oldFb = wrapper.querySelector('.fb-inline'); if(oldFb) oldFb.remove();
      if(!val){ inp.classList.remove('ok','no'); return; }
      if(val === ans){
        inp.classList.add('ok'); inp.classList.remove('no');
        const fb = document.createElement('span');
        fb.className = 'fb-inline right'; fb.textContent = '正确 ✓';
        wrapper.appendChild(fb);
      }else{
        inp.classList.add('no'); inp.classList.remove('ok');
        const fb = document.createElement('span');
        fb.className = 'fb-inline wrong'; fb.textContent = '错误 ✗ 答案：' + ans;
        wrapper.appendChild(fb);
      }
    }
    inp.addEventListener('input', check);
    inp.addEventListener('change', check);
  });
}

/* ================= 初始化 ================= */
if(LESSON_ORDER.length > 0){
  currentPage = LESSON_ORDER[0];
  buildQuicknav(LESSON_ORDER[0]);
  loadAudioForPage(LESSON_ORDER[0], null);
  renderMarkup(document);
  bindInteractions(document);
  const observer = new MutationObserver(()=>renderMarkup(document));
  observer.observe(document.body, {subtree:true, attributes:true, attributeFilter:['class']});
}

/* ===== Ctrl + 滚轮 自定义缩放 ===== */
let pageZoom = 1;
window.addEventListener('wheel', (e)=>{
  if(!e.ctrlKey) return;
  e.preventDefault();
  const cx = e.clientX, cy = e.clientY;
  const anchor = document.elementFromPoint(cx, cy) || document.body;
  const r0 = anchor.getBoundingClientRect();
  const offX = cx - r0.left, offY = cy - r0.top;
  const next = Math.min(3, Math.max(0.4, pageZoom * (e.deltaY < 0 ? 1.1 : 1/1.1)));
  if(next === pageZoom) return;
  pageZoom = next;
  document.body.style.zoom = pageZoom;
  const r1 = anchor.getBoundingClientRect();
  window.scrollBy(r1.left - (cx - offX), r1.top - (cy - offY));
}, {passive:false});

</script>
